
[project]
name = "airvision"
version = "2.0.0"
description = "AirVision air-quality analytics and PM2.5 prediction dashboard"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "requests==2.34.2"
]

[tool.vercel]
entrypoint = "backend.main:app"
